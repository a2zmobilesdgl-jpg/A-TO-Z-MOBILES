    <line x1="18" y1="8" x2="32" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <circle cx="25" cy="34" r="16" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
    <path d="M17 38 L25 24 L33 38" stroke="url(#azGradDark)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M19 34 L31 34" stroke="url(#azGradDark)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 40 L28 40 L22 47 L30 47" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="19" y1="60" x2="31" y2="60" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="43" cy="10" r="6" fill="#10B981" />
