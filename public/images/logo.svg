<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Phone & Refurbished Icon Badge -->
  <g transform="translate(10, 8)">
    <!-- Phone Body -->
    <rect x="2" y="2" width="46" height="64" rx="10" fill="url(#shieldGrad)" stroke="url(#azGrad)" stroke-width="2.5" />
    <!-- Screen Notch/Speaker -->
    <line x1="18" y1="8" x2="32" y2="8" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    <!-- Dynamic A-to-Z Arrow Ring -->
    <circle cx="25" cy="34" r="16" stroke="#334155" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
    <path d="M17 38 L25 24 L33 38" stroke="url(#azGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M19 34 L31 34" stroke="url(#azGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Small Z accent -->
    <path d="M20 40 L28 40 L22 47 L30 47" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Home Bar -->
    <line x1="19" y1="60" x2="31" y2="60" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
    <!-- Verified Badge Dot -->
    <circle cx="43" cy="10" r="6" fill="#10B981" />
    <path d="M40 10 L42 12 L46 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(75, 20)">
    <!-- A TO Z text -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
      A TO Z
      <tspan fill="url(#azGrad)"> MOBILES</tspan>
    </text>
    <!-- Tagline & Trust pill -->
    <rect x="0" y="35" width="168" height="15" rx="4" fill="#EFF6FF" />
    <text x="6" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#2563EB" letter-spacing="1">
      CERTIFIED PRE-OWNED PHONES
    </text>
  </g>
</svg>
